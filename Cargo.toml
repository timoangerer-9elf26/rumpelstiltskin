[package]
name = "rumpelstiltskin"
version = "0.1.0"
edition = "2024"
description = "Slack bot that hands messages to Paseo agents and lets agents answer as the bot"
license = "Apache-2.0"
repository = "https://github.com/timoangerer-9elf26/rumpelstiltskin"
readme = "README.md"

[[bin]]
name = "rumpel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
